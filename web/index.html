<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Realtime Object Identifier - Stream</title>
    <style>
      body { font-family: Arial, sans-serif; background:#222; color:#ddd; display:flex; flex-direction:column; align-items:center; }
      h1 { color: #ffd700; margin-top:18px }
      .container { width: 820px; max-width:95%; }
      .stream { margin-top: 12px; background:#111; padding:8px; border-radius:4px; }
      img { max-width: 100%; height: auto; border: 4px solid #444; display:block }
      .controls { margin-top:12px; display:flex; gap:8px; align-items:center; flex-wrap:wrap }
      .preview-box { width: 220px; height:140px; background:#000; border:2px solid #333; position:relative; overflow:hidden }
      .preview-box img { width:100%; height:100%; object-fit:cover }
      .badge { background:rgba(0,0,0,0.6); color:#9ef; padding:4px 8px; border-radius:4px; font-weight:600 }
      .result-text { color:#9ef; margin-left:8px }
      .muted { color:#999 }
      button, input[type="file"], input[type="text"] { background:#fff1; color:#fff; border:1px solid #555; padding:6px 8px; border-radius:4px }
    </style>
  </head>
  <body>
    <h1>Realtime Object Identifier - Stream</h1>
    <div class="container">
      <div class="stream">
        <div style="display:flex;gap:12px;align-items:flex-start;">
          <div style="flex:1">
            <canvas id="streamCanvas" width="960" height="540" style="width:100%;max-width:100%;border:6px solid #444;background:#000;border-radius:6px"></canvas>
          </div>
        </div>
      </div>

      <div class="controls">
        <div style="display:flex;align-items:center;gap:8px;">
          <button id="classifyBtn">Classify Scene (server)</button>
          <span id="sceneResult" class="result-text"></span>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <input id="tmplLabel" placeholder="Template label (e.g. flood)" style="padding:6px;" />
          <button id="addTmplBtn">Add Template (server)</button>
          <span id="addResult" class="muted"></span>
          <a href="/upload" class="link">Go to Upload Page</a>
        </div>
      </div>
      <div class="controls" style="margin-top:10px">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <button id="openCamBtn">Open Camera</button>
          <button id="addLocalBtn">Add Template (local)</button>
          <button id="trainLocalBtn">Train (local)</button>
          <button id="classifyLocalBtn">Classify (local)</button>
          <span id="localResult" class="result-text"></span>
        </div>
      </div>
    </div>
    
    <script src="/web/config.js"></script>
    <script src="https://unpkg.com/ml5@latest/dist/ml5.min.js"></script>
    <script>
      const API_BASE = (typeof API_BASE_URL !== 'undefined') ? API_BASE_URL : '';
      // Server buttons
      const classifyBtn = document.getElementById('classifyBtn');
      const resSpan = document.getElementById('sceneResult');
      classifyBtn.addEventListener('click', async () => {
        classifyBtn.disabled = true;
        resSpan.textContent = 'Classifying...';
        try {
          const r = await fetch(API_BASE + '/classify_scene', { method: 'POST' });
          const text = await r.text();
          try {
            const j = JSON.parse(text);
            if (!r.ok) {
              resSpan.textContent = `Server error: ${j.error || j.message || text}`;
            } else if (j.label) {
              resSpan.textContent = j.label + ' (' + Math.round((j.score||0)*100) + '%)';
            } else {
              resSpan.textContent = JSON.stringify(j);
            }
          } catch (pe) {
            resSpan.textContent = `Bad JSON response: ${r.status} ${text}`;
          }
        } catch (e) {
          resSpan.textContent = 'Network error: ' + e.message;
        }
        classifyBtn.disabled = false;
      });

      const addBtn = document.getElementById('addTmplBtn');
      const addResult = document.getElementById('addResult');
      addBtn.addEventListener('click', async () => {
        const label = document.getElementById('tmplLabel').value.trim();
        if (!label) { addResult.textContent = 'Enter label'; return; }
        addBtn.disabled = true; addResult.textContent = 'Saving...';
        try {
          const r = await fetch(API_BASE + '/add_template', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ label }) });
          const j = await r.json();
          addResult.textContent = j.status || 'saved';
        } catch (e) {
          addResult.textContent = 'Error';
        }
        addBtn.disabled = false;
      });

      // Local ml5 client-side setup
      const streamCanvas = document.getElementById('streamCanvas');
      const streamCtx = streamCanvas.getContext('2d');
      const previewThumb = document.getElementById('previewThumb');
      if (API_BASE) previewThumb.src = API_BASE + '/video_feed';

      let videoEl = null;
      let featureExtractor = null;
      let classifier = null;
      let modelReady = false;

      function initLocalMl5() {
        if (featureExtractor) return;
        document.getElementById('localResult').textContent = 'Loading model...';
        featureExtractor = ml5.featureExtractor('MobileNet', { numLabels: 10 }, () => {
          classifier = featureExtractor.classification(streamCanvas, () => {
            modelReady = true;
            document.getElementById('localResult').textContent = 'Model ready (local)';
            // enable local buttons
            document.getElementById('addLocalBtn').disabled = false;
            document.getElementById('trainLocalBtn').disabled = false;
            document.getElementById('classifyLocalBtn').disabled = false;
          });
        });
      }

      // disable local controls until model is ready
      document.getElementById('addLocalBtn').disabled = true;
      document.getElementById('trainLocalBtn').disabled = true;
      document.getElementById('classifyLocalBtn').disabled = true;

      document.getElementById('openCamBtn').addEventListener('click', async () => {
        if (!videoEl) {
          videoEl = document.createElement('video');
          videoEl.autoplay = true; videoEl.playsInline = true; videoEl.muted = true;
          // show video preview for debugging on phones
          videoEl.style.display = 'block'; videoEl.style.width = '200px'; videoEl.style.border = '2px solid #444';
          document.querySelector('.stream').insertBefore(videoEl, document.querySelector('.stream').firstChild);
          try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
            videoEl.srcObject = stream; await videoEl.play();
            const loop = () => {
              if (videoEl && !videoEl.paused && !videoEl.ended) {
                streamCtx.drawImage(videoEl, 0, 0, streamCanvas.width, streamCanvas.height);
              }
              requestAnimationFrame(loop);
            };
            loop();
            initLocalMl5();
            document.getElementById('openCamBtn').disabled = true; document.getElementById('openCamBtn').textContent = 'Camera Open';
          } catch (e) {
            console.error('getUserMedia error', e);
            document.getElementById('localResult').textContent = 'Camera denied or not available (HTTPS required)';
          }
        }
      });

      document.getElementById('addLocalBtn').addEventListener('click', () => {
        const lbl = (document.getElementById('tmplLabel').value || '').trim();
        if (!lbl) { document.getElementById('localResult').textContent = 'Enter a label'; return; }
        if (!featureExtractor) initLocalMl5();
        if (!modelReady && !classifier) { document.getElementById('localResult').textContent = 'Initializing model...'; return; }
        classifier.addImage(streamCanvas, lbl, () => { document.getElementById('localResult').textContent = 'Added example: ' + lbl; });
      });

      document.getElementById('trainLocalBtn').addEventListener('click', () => {
        if (!classifier) { document.getElementById('localResult').textContent = 'Model not ready'; return; }
        document.getElementById('localResult').textContent = 'Training...';
        classifier.train((loss) => { if (loss === null) document.getElementById('localResult').textContent = 'Training complete'; else document.getElementById('localResult').textContent = 'Loss: ' + loss.toFixed(4); });
      });

      document.getElementById('classifyLocalBtn').addEventListener('click', () => {
        if (!classifier) { document.getElementById('localResult').textContent = 'Model not ready'; return; }
        document.getElementById('localResult').textContent = 'Classifying...';
        classifier.classify(streamCanvas, (err, results) => {
          if (err) { document.getElementById('localResult').textContent = 'Error'; return; }
          if (results && results[0]) {
            const r = results[0];
            document.getElementById('localResult').textContent = `${r.label} (${Math.round(r.confidence*100)}%)`;
            // overlay
            streamCtx.fillStyle = 'rgba(0,0,0,0.6)'; streamCtx.fillRect(0, streamCanvas.height - 36, streamCanvas.width, 36);
            streamCtx.fillStyle = '#9ef'; streamCtx.font = '18px Arial'; streamCtx.textBaseline = 'middle'; streamCtx.fillText(`${r.label} (${Math.round(r.confidence*100)}%)`, 12, streamCanvas.height - 18);
          } else document.getElementById('localResult').textContent = 'No result';
        });
      });
    </script>
    <p>Press Ctrl+C in the server terminal to stop.</p>
  </body>
</html>
