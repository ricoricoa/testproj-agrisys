<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Realtime Object Identifier - Stream</title>
    <style>
      body { font-family: Arial, sans-serif; background:#222; color:#ddd; display:flex; flex-direction:column; align-items:center; }
      h1 { color: #ffd700; margin-top:18px }
      .container { width: 820px; max-width:95%; }
      .stream { margin-top: 12px; background:#111; padding:8px; border-radius:4px; }
      img { max-width: 100%; height: auto; border: 4px solid #444; display:block }
      .controls { margin-top:12px; display:flex; gap:8px; align-items:center; flex-wrap:wrap }
      .preview-box { width: 220px; height:140px; background:#000; border:2px solid #333; position:relative; overflow:hidden }
      .preview-box img { width:100%; height:100%; object-fit:cover }
      .badge { background:rgba(0,0,0,0.6); color:#9ef; padding:4px 8px; border-radius:4px; font-weight:600 }
      .result-text { color:#9ef; margin-left:8px }
      .muted { color:#999 }
      button, input[type="file"], input[type="text"] { background:#fff1; color:#fff; border:1px solid #555; padding:6px 8px; border-radius:4px }
    </style>
  </head>
  <body>
    <h1>Realtime Object Identifier - Stream</h1>
    <div class="container">
      <div class="stream">
        <img id="stream" src="/video_feed" alt="video stream" />
      </div>

      <div class="controls">
        <div style="display:flex;align-items:center;gap:8px;">
          <button id="classifyBtn">Classify Scene</button>
          <span id="sceneResult" class="result-text"></span>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <input id="tmplLabel" placeholder="Template label (e.g. flood)" style="padding:6px;" />
          <button id="addTmplBtn">Add Template</button>
          <span id="addResult" class="muted"></span>
          <a href="/upload" class="link">Go to Upload Page</a>
        </div>
      </div>
    </div>
    
    <script>
      const classifyBtn = document.getElementById('classifyBtn');
      const resSpan = document.getElementById('sceneResult');
      classifyBtn.addEventListener('click', async () => {
        classifyBtn.disabled = true;
        resSpan.textContent = 'Classifying...';
        try {
          const r = await fetch('/classify_scene', { method: 'POST' });
          const j = await r.json();
          resSpan.textContent = j.label + ' (' + Math.round(j.score*100) + '%)';
        } catch (e) {
          resSpan.textContent = 'Error';
        }
        classifyBtn.disabled = false;
      });

      const addBtn = document.getElementById('addTmplBtn');
      const addResult = document.getElementById('addResult');
      addBtn.addEventListener('click', async () => {
        const label = document.getElementById('tmplLabel').value.trim();
        if (!label) { addResult.textContent = 'Enter label'; return; }
        addBtn.disabled = true; addResult.textContent = 'Saving...';
        try {
          const r = await fetch('/add_template', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ label }) });
          const j = await r.json();
          addResult.textContent = j.status || 'saved';
        } catch (e) {
          addResult.textContent = 'Error';
        }
        addBtn.disabled = false;
      });

      const uploadBtn = document.getElementById('uploadBtn');
      const uploadResult = document.getElementById('uploadResult');
      const uploadFile = document.getElementById('uploadFile');
      const uploadPreview = document.getElementById('uploadPreview');

      // Show preview when a file is chosen
      uploadFile.addEventListener('change', () => {
        const f = uploadFile.files && uploadFile.files[0];
        if (!f) { uploadPreview.src = ''; return; }
        const url = URL.createObjectURL(f);
        uploadPreview.src = url;
        uploadResult.textContent = '';
      });

      uploadBtn.addEventListener('click', async () => {
        const fileEl = uploadFile;
        if (!fileEl.files || fileEl.files.length === 0) { uploadResult.textContent = 'Select a file'; return; }
        uploadBtn.disabled = true; uploadResult.textContent = 'Uploading...';
        const fd = new FormData();
        fd.append('image', fileEl.files[0]);
        try {
          const r = await fetch('/upload_image', { method: 'POST', body: fd });
          const j = await r.json();
          if (j.label) {
            uploadResult.textContent = j.label + ' (' + Math.round(j.score*100) + '%)';
            uploadResult.className = 'badge';
          } else {
            uploadResult.textContent = JSON.stringify(j);
          }
        } catch (e) {
          uploadResult.textContent = 'Error';
        }
        uploadBtn.disabled = false;
      });

      const saveTemplateBtn = document.getElementById('saveTemplateBtn');
      saveTemplateBtn.addEventListener('click', async () => {
        const fileEl = uploadFile;
        const label = document.getElementById('tmplLabel').value.trim();
        if (!fileEl.files || fileEl.files.length === 0) { uploadResult.textContent = 'Select a file'; return; }
        saveTemplateBtn.disabled = true; uploadResult.textContent = 'Saving template...';
        const fd = new FormData();
        fd.append('image', fileEl.files[0]);
        fd.append('label', label);
        try {
          const r = await fetch('/add_template_upload', { method: 'POST', body: fd });
          const j = await r.json();
          uploadResult.textContent = j.status || 'saved';
        } catch (e) {
          uploadResult.textContent = 'Error';
        }
        saveTemplateBtn.disabled = false;
      });
    </script>
    <p>Press Ctrl+C in the server terminal to stop.</p>
  </body>
</html>
